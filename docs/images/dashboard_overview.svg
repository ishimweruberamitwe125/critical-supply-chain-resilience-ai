  <rect x="760" y="170" width="320" height="28" fill="#7c3aed"/><text x="740" y="189" text-anchor="end" font-size="12" fill="#334155">Pacific Silicon</text>
  <rect x="760" y="210" width="280" height="28" fill="#7c3aed"/><text x="740" y="229" text-anchor="end" font-size="12" fill="#334155">Blue Ridge Rare Earths</text>
  <rect x="760" y="250" width="220" height="28" fill="#7c3aed"/><text x="740" y="269" text-anchor="end" font-size="12" fill="#334155">Sunrise PCB</text>
  <rect x="760" y="290" width="180" height="28" fill="#7c3aed"/><text x="740" y="309" text-anchor="end" font-size="12" fill="#334155">Andes Copper Foil</text>

  <rect x="40" y="420" width="540" height="320" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">Disruption Scenario Impact (Service Level %)</text>
  <rect x="90" y="500" width="100" height="180" fill="#0891b2"/><text x="140" y="700" text-anchor="middle" font-size="11" fill="#475569">Wafer Outage</text><text x="140" y="590" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">62%</text>
  <rect x="230" y="540" width="100" height="140" fill="#0891b2"/><text x="280" y="700" text-anchor="middle" font-size="11" fill="#475569">Packaging</text><text x="280" y="610" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">48%</text>
  <rect x="370" y="560" width="100" height="120" fill="#0891b2"/><text x="420" y="700" text-anchor="middle" font-size="11" fill="#475569">Factory</text><text x="420" y="620" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">41%</text>

  <rect x="620" y="420" width="540" height="320" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="640" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">Mitigation Priority (Potential Service Gain %)</text>
