  <rect x="760" y="545" width="300" height="28" fill="#16a34a"/><text x="740" y="564" text-anchor="end" font-size="12" fill="#334155">chip_packaging</text>
  <rect x="760" y="590" width="260" height="28" fill="#16a34a"/><text x="740" y="609" text-anchor="end" font-size="12" fill="#334155">rare_earth_materials</text>
