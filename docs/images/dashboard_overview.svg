  <rect x="40" y="70" width="540" height="320" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">Resilience KPIs</text>
  <rect x="70" y="130" width="90" height="180" fill="#dc2626"/><text x="115" y="330" text-anchor="middle" font-size="11" fill="#475569">Risk Index</text><text x="115" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">0.42</text>
  <rect x="180" y="150" width="90" height="160" fill="#ea580c"/><text x="225" y="330" text-anchor="middle" font-size="11" fill="#475569">Dependency</text><text x="225" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">0.75</text>
  <rect x="290" y="170" width="90" height="140" fill="#ca8a04"/><text x="335" y="330" text-anchor="middle" font-size="11" fill="#475569">Propagation</text><text x="335" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">0.38</text>
  <rect x="400" y="120" width="90" height="190" fill="#2563eb"/><text x="445" y="330" text-anchor="middle" font-size="11" fill="#475569">Recovery Days</text><text x="445" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">24.5</text>

  <rect x="620" y="70" width="540" height="320" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
